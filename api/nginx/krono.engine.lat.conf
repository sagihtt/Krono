server {
    listen 80;
    server_name krono.engine.lat;

    root /home/engine/labs/krono/web;
    index index.html;

    # Redireciona /api sem barra para /api/
    location = /api {
        return 301 /api/;
    }

    # Proxy reverso da API Krono (precedencia sobre regex de arquivos estaticos via ^~)
    location ^~ /api/ {
        client_max_body_size 12M;
        proxy_pass http://127.0.0.1:8085/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    # SPA Expo Router Web
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location ~* \.(ttf|woff|woff2|png|jpg|jpeg|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
